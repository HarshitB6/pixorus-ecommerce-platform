{% extends "base.html" %}
{% block content %}

<div class="auth-wrapper">
    <div class="auth-box">
        <div class="auth-brand">PIXORUS</div>
        <h2>Welcome Back 👋</h2>
        <p class="auth-sub">Sign in to your account</p>

        {% if error %}
        <div class="alert alert-error">{{ error }}</div>
        {% endif %}

        <form action="/login" method="post">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" class="form-input" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" class="form-input" placeholder="Your password" required>
            </div>
            <button type="submit" class="btn btn-large" style="width:100%">Login</button>
        </form>

        <p class="auth-footer">
            Don't have an account? <a href="/register">Register here</a>
        </p>
        <p class="auth-footer" style="margin-top:5px; color: #888;">
            Admin: admin@pixorus.com / admin123
        </p>
    </div>
</div>

{% endblock %}
