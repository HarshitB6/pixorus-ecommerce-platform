{% extends "base.html" %}
{% block content %}

<div class="auth-wrapper">
    <div class="auth-box">
        <div class="auth-brand">PIXORUS</div>
        <h2>Create Account</h2>
        <p class="auth-sub">Join thousands of happy shoppers</p>

        {% if error %}
        <div class="alert alert-error">{{ error }}</div>
        {% endif %}

        <form action="/register" method="post">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="name" class="form-input" placeholder="Your full name" required>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" class="form-input" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" class="form-input" placeholder="Minimum 6 characters" minlength="6" required>
            </div>
            <button type="submit" class="btn btn-large" style="width:100%">Create Account</button>
        </form>

        <p class="auth-footer">
            Already have an account? <a href="/login">Login here</a>
        </p>
    </div>
</div>

{% endblock %}
